site_name: Systems & Field Notes
site_description: WVU MIS student focused on systems administration, network engineering, and infrastructure automation
site_url: https://bpf00010.github.io/

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Projects:
      - Overview: projects/index.md
      - IP-Geo-Mapper: projects/ip-geo-mapper.md
      - GNS3 Enterprise Network: projects/gns3-network.md
  - Systems & Automation:
      - Lab Images & Deployment: engineering/lab-provisioning.md
      - GitLab & AWX Automation: engineering/awx-orchestration.md
      - Linux Directory Optimization: engineering/sssd-tuning.md
  - Experience: experience.md
  - Certifications: certifications.md
  - About: about.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

extra_css:
  - stylesheets/extra.css
