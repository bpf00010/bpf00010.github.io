site_name: Systems & Field Notes
site_description: WVU MIS student focused on systems administration, network engineering, and infrastructure automation
site_url: https://bpf00010.github.io/

theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html

plugins: []

nav:
  - Home: index.md
  - Projects:
      - Overview: projects/index.md
      - IP-Geo-Mapper: projects/ip-geo-mapper.md
      - GNS3 Enterprise Network: projects/gns3-network.md
  - Systems & Automation:
      - Lab Images & Deployment: engineering/lab-provisioning.md
      - GitLab & AWX Automation: engineering/awx-orchestration.md
      - Linux Directory Optimization: engineering/sssd-tuning.md
  - Experience: experience.md
  - Certifications: certifications.md
  - About: about.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

validation:
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

extra_css:
  - stylesheets/extra.css
