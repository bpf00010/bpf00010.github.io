site_name: My Portfolio & Projects
site_description: Personal portfolio and technical project showcases
site_url: https://bpf00010.github.io/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Projects:
      - Overview: projects/index.md
      - Project One: projects/project-one.md
  - About: about.md